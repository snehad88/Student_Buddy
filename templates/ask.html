<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ask a Question - Student Buddy</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <header>

        <div class="logo">💡</div>

        <div>
            <h1>Ask a Question</h1>
            <p>Student Buddy AI Assistant</p>
        </div>

    </header>


    <main>

        <div class="learning-header">

            <h2>{{ chapter }}</h2>

            <p>{{ subject }} • Class 8</p>

        </div>


        <div class="question-box">

            <h2>💬 What would you like to ask?</h2>

            <form action="/ask-question" method="POST">

                <input type="hidden"
                       name="subject"
                       value="{{ subject }}">

                <input type="hidden"
                       name="chapter"
                       value="{{ chapter }}">


                <textarea
                    name="question"
                    placeholder="Type your question here..."
                    required></textarea>


                <button type="submit">
                   ✨ Get Answer
                </button>

            </form>

        </div>


        <br>

        <a href="/learn?subject={{ subject }}&chapter={{ chapter }}">
            ← Back to Learning
        </a>

    </main>

</div>
<script>

    const startTime = Date.now();

    function saveLearningTime() {

        const endTime = Date.now();

        const duration =
            Math.floor((endTime - startTime) / 1000);

        if (duration < 1) {
            return;
        }

        fetch("/track-time", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                section: "Ask a Question",

                duration: duration

            })

        });

    }

    window.addEventListener(
        "beforeunload",
        saveLearningTime
    );

</script>
</body>

</html>
